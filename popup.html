<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-color: #0f0f12;
      --text-color: #e3e3e6;
      --sub-text: #a1a1aa;
      --input-bg: #16161a;
      --border-color: #2c2c35;
    }

    :root.light {
      --bg-color: #ffffff;
      --text-color: #1f1f23;
      --sub-text: #5f6368;
      --input-bg: #f1f3f4;
      --border-color: #dadce0;
    }

    body {
      width: 325px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      transition: background 0.2s, color 0.2s;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #8ab4f8;
    }

    :root.light h3 {
      color: #4776e6;
    }

    #theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 5px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: inherit;
    }

    #theme-toggle:hover {
      background: rgba(128, 128, 128, 0.15);
    }

    .select-container {
      margin-bottom: 11px;
    }

    label.block-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--sub-text);
      display: block;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    select {
      width: 100%;
      padding: 9px 10px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-color);
      font-size: 12.5px;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: #4776e6;
    }

    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(128, 128, 128, 0.08);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
    }

    .toggle-label {
      font-size: 12.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background: linear-gradient(135deg, #8ab4f8, #4776e6);
    }

    input:checked+.slider:before {
      transform: translateX(18px);
    }

    .slider-box {
      background: rgba(128, 128, 128, 0.08);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
    }

    .slider-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .slider-top .slider-label {
      font-size: 12.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .slider-val-badge {
      font-size: 11px;
      font-weight: 600;
      color: #8ab4f8;
      background: rgba(138, 180, 248, 0.12);
      padding: 2px 7px;
      border-radius: 6px;
    }

    :root.light .slider-val-badge {
      color: #4776e6;
      background: rgba(71, 118, 230, 0.12);
    }

    .opacity-range {
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: var(--border-color);
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
      margin: 4px 0;
    }

    .opacity-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #8ab4f8;
      cursor: pointer;
    }

    :root.light .opacity-range::-webkit-slider-thumb {
      background: #4776e6;
    }

    .slider-hints {
      display: flex;
      justify-content: space-between;
      font-size: 9.5px;
      color: var(--sub-text);
      margin-top: 2px;
    }

    .keys-section {
      margin-top: 8px;
      margin-bottom: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .key-field-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .key-label {
      font-size: 11px;
      color: var(--sub-text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-req {
      font-size: 9.5px;
      color: #8ab4f8;
      font-weight: 600;
    }

    .badge-groq {
      font-size: 9.5px;
      color: #f97316;
      font-weight: 600;
    }

    .badge-opt {
      font-size: 9.5px;
      opacity: 0.7;
    }

    input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 12px;
      color: var(--text-color);
      outline: none;
    }

    input[type="password"]:focus {
      border-color: #4776e6;
    }

    input[type="password"].input-error {
      border-color: #ef4444;
    }

    button#save {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #8ab4f8, #4776e6);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    button#save:hover {
      opacity: 0.92;
    }

    #status {
      font-size: 11.5px;
      color: #34a853;
      text-align: center;
      margin-top: 6px;
      font-weight: 500;
      min-height: 15px;
    }
  </style>
</head>

<body>
  <div class="header">
    <h3>✨ Quick Assist PRO</h3>
    <button id="theme-toggle" title="Сменить тему">🌙</button>
  </div>

  <div class="toggle-container">
    <span class="toggle-label">🤖 Ассистент</span>
    <label class="switch">
      <input type="checkbox" id="assistant-active" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-container">
    <span class="toggle-label">🛡️ Обход защиты и Capture</span>
    <label class="switch">
      <input type="checkbox" id="bypass-active" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="slider-box">
    <div class="slider-top">
      <span class="slider-label">👻 Прозрачность (маскировка)</span>
      <span id="opacity-val" class="slider-val-badge">25%</span>
    </div>
    <input type="range" id="opacity-slider" class="opacity-range" min="10" max="85" value="25" step="5">
    <div class="slider-hints">
      <span>10% (невидимо)</span>
      <span>25% (стекло)</span>
      <span>85% (плотно)</span>
    </div>
  </div>

  <div class="select-container">
    <label class="block-label">⚡ Режим переключения моделей:</label>
    <select id="provider-mode">
      <option value="auto-hybrid">Авто: Gemini (Умные) ➔ Groq (Резерв)</option>
      <option value="groq-only">Только Groq (gpt-oss-120b · Быстро)</option>
      <option value="groq-first">Groq 120B ➔ Gemini (Резерв)</option>
      <option value="gemini-only">Только Gemini (4 Hydrogen ➔ Lite)</option>
    </select>
  </div>

  <div class="keys-section">
    <div class="key-field-wrap">
      <div class="key-label">
        <span>Groq Console API-ключ (gsk_...)</span>
        <span class="badge-groq">Быстрый резерв</span>
      </div>
      <input type="password" id="groqApiKey" placeholder="gsk_... (из Groq Console)" autocomplete="off">
    </div>

    <div class="key-field-wrap">
      <div class="key-label">
        <span>Gemini API-ключ #1</span>
        <span class="badge-req">Основной</span>
      </div>
      <input type="password" id="apiKey1" placeholder="AIzaSy... (ключ #1)" autocomplete="off">
    </div>

    <div class="key-field-wrap">
      <div class="key-label">
        <span>Gemini API-ключ #2</span>
        <span class="badge-opt">Необязательный</span>
      </div>
      <input type="password" id="apiKey2" placeholder="AIzaSy... (резерв 1)" autocomplete="off">
    </div>

    <div class="key-field-wrap">
      <div class="key-label">
        <span>Gemini API-ключ #3</span>
        <span class="badge-opt">Необязательный</span>
      </div>
      <input type="password" id="apiKey3" placeholder="AIzaSy... (резерв 2)" autocomplete="off">
    </div>
  </div>

  <button id="save">Сохранить настройки</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>

</html>
